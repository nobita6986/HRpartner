## G0-04 / RQ-02, RQ-07. Minimal, reproducible CI: schema validation, typecheck, lint,
## unit tests, build — on every PR and push to main. Integration (DB) tests run in a
## SEPARATE job that fails closed (ENV_BLOCKED) when no dedicated test-DB secret is present,
## and never runs privileged on fork PRs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default (RQ-07). No job needs write scopes.
permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (schema · typecheck · lint · unit · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy, non-secret URLs so `prisma generate/validate` and `next build` can read the
      # datasource env WITHOUT a real database. Prisma connects lazily (on first query), and
      # none of these steps issues one — nothing ever dials localhost. The unit lane ignores
      # this entirely: vitest.unit.config.ts FORCES an unreachable sentinel of its own.
      # Both DATABASE_URL (pooled writer) and DATABASE_URL_ADMIN (Prisma migrate / directUrl
      # DDL) are required by prisma/schema.prisma at validation time; the dummy values just
      # satisfy env(...) lookup — they are never dialed in CI (see schema.prisma:30).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
      DATABASE_URL_ADMIN: postgresql://ci:ci@localhost:5432/ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma schema validate
        run: npx prisma validate
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint .)
        run: npm run lint
      - name: Unit tests (no DB — fail-closed sentinel)
        run: npm run test:unit
      - name: Build (next build)
        run: npm run build
# <<APPEND-INTEGRATION-JOB>>
  integration:
    name: Integration (DB tests · fail-closed)
    concurrency:
      group: hrpartner-dedicated-integration-db
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never run on a FORK pull request: secrets are not exposed to forks (RQ-07), and we do
    # not want a dedicated test-DB touched from untrusted PR code. Same-repo PRs, pushes to
    # main, and manual dispatch still run — and fail closed (ENV_BLOCKED) if no secret is set.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # For PRs we need a diff base; fetch enough history to diff against the
          # base ref. `fetch-depth: 0` is the safe minimum (covers shallow + normal).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Detect changed paths (short-circuit for docs/config-only PRs)
        id: path-filter
        shell: bash
        # Fail-safe default = RUN. Only SKIP when EVERY changed file falls into the
        # conservative allowlist below. Any file outside the allowlist → continue
        # full Integration run (env-blocked semantics unchanged).
        run: |
          set -euo pipefail
          # Resolve base ref safely: PR → base.sha, push → github.event.before, fallback → origin/main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse origin/main)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::warning::could not resolve BASE_SHA — fail-safe to RUN full Integration"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA="${{ github.sha }}"
          echo "BASE_SHA=$BASE_SHA HEAD_SHA=$HEAD_SHA"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          if [ -z "$CHANGED" ]; then
            echo "::warning::empty diff (likely initial push to main) — RUN full Integration"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"
          should_run=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|scratch/*|.gitignore|README*|.env.example)
                echo "  SKIP-eligible: $f" ;;
              *)
                should_run=true
                echo "  RUN-required:  $f" ;;
            esac
          done <<< "$CHANGED"
          if [ "$should_run" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Decision: RUN full Integration (code/schema/RLS path changed)"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Decision: docs/config-only — Integration skipped (job still reports success)"
          fi
      - name: Install (clean, from lockfile)
        if: steps.path-filter.outputs.should_run != 'false'
        run: npm ci
      - name: Prisma generate
        if: steps.path-filter.outputs.should_run != 'false'
        run: npm run prisma:generate
      - name: Integration tests (dedicated test DB only; ENV_BLOCKED if absent)
        # The preflight refuses dev/prod URLs, requires DATABASE_URL_TEST, and prints ENV_BLOCKED
        # Local runs may report ENV_BLOCKED with exit 0, but CI is always strict: a missing
        # dedicated test DB is a red blocked check, never a green/fake integration PASS.
        if: steps.path-filter.outputs.should_run != 'false'
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          DATABASE_URL_ADMIN_TEST: ${{ secrets.DATABASE_URL_ADMIN_TEST }}
          CI_INTEGRATION_STRICT: '1'
        run: npm run test:integration
      - name: Short-circuit success (docs/config-only PRs)
        # Runs ONLY when path-filter decided should_run=false. The job still completes with
        # status=success, satisfying the "Integration (DB tests · fail-closed)" required check
        # on branch protection. No DB secrets accessed on this branch.
        if: steps.path-filter.outputs.should_run == 'false'
        run: |
          echo "=========================================="
          echo "  docs/config-only — Integration skipped"
          echo "=========================================="
          echo "Reason: changed files are exclusively in the docs/config allowlist."
          echo "No code/schema/RLS touch detected by git diff against base SHA."
          echo "Branch protection requires this check to report success — and it does."
          echo "Quality job covers typecheck/lint/unit/build for docs-only PRs."
