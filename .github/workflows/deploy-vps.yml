name: Deploy HRP to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA to deploy (blank = current main)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hrp-production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMAGE_REPOSITORY: ghcr.io/nobita6986/hrpartner
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-${WORKFLOW_SHA:-}}"
          if [ -z "$sha" ]; then
            sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release SHA must be a full 40-character commit"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Build immutable image
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build --build-arg "SOURCE_REVISION=$RELEASE_SHA" --tag "$IMAGE_REPOSITORY:$RELEASE_SHA" .

      - name: Push image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_REPOSITORY:$RELEASE_SHA"
          docker logout ghcr.io

      - name: Configure pinned SSH host
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull, migration-check, deploy and smoke-test
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$RELEASE_SHA"
          # The GHCR package is public. No VPS-side `docker login` is needed.
          # VPS user (hrpdeploy) is locked down to three NOPASSWD sudo
          # wrappers and must not write a Docker credential store under
          # $HOME=/opt/hrp. /opt/hrp is root-owned; deploy-production.sh is
          # invoked via `sudo -n` with a narrow NOPASSWD entry for that
          # exact path only (see /etc/sudoers.d/hrpdeploy-deploy).
          ssh "$VPS_USER@$VPS_HOST" "docker pull '$image' && sudo -n /usr/local/sbin/hrp-check-migrations '$image' && sudo -n /opt/hrp/deploy-production.sh '$image'"
