services:
  app:
    image: hrp-preview:bf5734bd
    container_name: hrp-preview
    env_file:
      - /etc/hrp/secrets/preview.env
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /srv/hrp/evidence:/data/hrp/evidence
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=128m,mode=1777
