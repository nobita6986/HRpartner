server {
    listen 80;
    listen [::]:80;
    server_name vieclammienbac.com.vn www.vieclammienbac.com.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vieclammienbac.com.vn www.vieclammienbac.com.vn;

    ssl_certificate /etc/letsencrypt/live/vieclammienbac.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vieclammienbac.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic "HRP private preview";
    auth_basic_user_file /etc/nginx/.htpasswd-hrp-preview;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags session secure httponly samesite=lax;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
