server {
    listen 80;
    listen [::]:80;
    server_name vieclammienbac.com.vn www.vieclammienbac.com.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vieclammienbac.com.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vieclammienbac.com.vn;

    ssl_certificate /etc/letsencrypt/live/vieclammienbac.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vieclammienbac.com.vn/privkey.pem;
    return 301 https://vieclammienbac.com.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vieclammienbac.com.vn;

    ssl_certificate /etc/letsencrypt/live/vieclammienbac.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vieclammienbac.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append client-controlled X-Forwarded-For. The app
        # intentionally trusts the first value in production for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags session secure httponly samesite=lax;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
